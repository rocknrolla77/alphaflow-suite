# Файл: .github/workflows/ci.yml
# AlphaFlow Suite CI — Forge + Vitest + Docker Build

name: AlphaFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  # ─── Solidity Tests (Foundry) ───────────────────────────────────────
  contracts:
    name: Forge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        working-directory: ./contracts
        run: forge build --sizes

      - name: Run tests
        working-directory: ./contracts
        run: forge test -vvv --gas-report

      - name: Check formatting
        working-directory: ./contracts
        run: forge fmt --check

  # ─── TypeScript Tests (Vitest) ──────────────────────────────────────
  typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [bff, agent-tee, devops]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./${{ matrix.package }}
        run: npm install --legacy-peer-deps

      - name: Run tests
        working-directory: ./${{ matrix.package }}
        run: npm test

  # ─── Docker Build Verification ─────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build BFF
        run: docker build -t alphaflow-bff ./bff

      - name: Build TG Bot
        run: docker build -t alphaflow-tg-bot ./devops

      - name: Build TEE Agent
        run: docker build -t alphaflow-agent-tee ./agent-tee

  # ─── Integration Test (Anvil Fork) ─────────────────────────────────
  integration:
    name: Integration (Anvil Fork)
    runs-on: ubuntu-latest
    needs: [contracts, typescript]
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start Anvil Fork
        run: |
          anvil --fork-url https://rpc.mantle.xyz --chain-id 5000 --block-time 2 &
          sleep 5

      - name: Deploy contracts to fork
        working-directory: ./contracts
        run: |
          forge script script/Deploy.s.sol --rpc-url http://localhost:8545 --broadcast --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80

      - name: Run E2E tests
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps
          ANVIL_RPC=http://localhost:8545 npm test
