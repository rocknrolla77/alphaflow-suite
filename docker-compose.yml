# Файл: docker-compose.yml
# AlphaFlow Suite — Full Stack (Dev/Staging/Production)
# Production TEE: deploy agent-tee separately via Phala DStack
# Usage:
#   Dev:  docker compose --profile dev up
#   Test: docker compose --profile test up
#   Prod: docker compose up (core services only)

services:
  # ─── Redis (State Store + Pub/Sub) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: alphaflow_redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-alphaflow_dev}
      --tcp-backlog 128
      --timeout 300
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-alphaflow_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ─── BFF (Backend-for-Frontend) ─────────────────────────────────────
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: alphaflow_bff
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-alphaflow_dev}@redis:6379
      - PROPOSAL_HMAC_SECRET=${PROPOSAL_HMAC_SECRET}
      - MANTLE_RPC_PRIMARY=${MANTLE_RPC_PRIMARY:-https://rpc.mantle.xyz}
      - MANTLE_RPC_FALLBACKS=${MANTLE_RPC_FALLBACKS:-https://rpc.mantle.xyz,https://rpc.ankr.com/mantle}
      - ACTIVE_SENTINEL_ADDRESS=${ACTIVE_SENTINEL_ADDRESS}
      - DISPATCHER_ADDRESS=${DISPATCHER_ADDRESS}
      - WORKER_1_ADDRESS=${WORKER_1_ADDRESS}
      - WORKER_2_ADDRESS=${WORKER_2_ADDRESS}
      - WORKER_3_ADDRESS=${WORKER_3_ADDRESS}
      - MAX_STALENESS_PCT=${MAX_STALENESS_PCT:-2}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
      - PORT=3001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3



  # ─── TEE Agent (Development Mode — NOT in CVM) ─────────────────────
  # In production: deployed via `dstack deploy` to Phala Network
  agent-tee-dev:
    build:
      context: ./agent-tee
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-alphaflow_dev}@redis:6379
      - TEE_SIGNER_PRIVATE_KEY=${TEE_SIGNER_PRIVATE_KEY}
      - TEE_SIGNER_ADDRESS=${TEE_SIGNER_ADDRESS}
      - NANSEN_API_KEY=${NANSEN_API_KEY}
      - MANTLE_RPC_URL=${MANTLE_RPC_PRIMARY:-https://rpc.mantle.xyz}
      - DSTACK_SIMULATOR_ENDPOINT=http://localhost:8090
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - dev  # Only runs in development

  # ─── Byreal Swarm Workers (Race Condition Relay) ───────────────────
  # 3 independent workers compete to relay ForwardRequest on-chain.
  # First to succeed gets MNT refund from MicroFundingDispatcher.
  byreal-worker-1:
    build:
      context: ./agent-tee
      dockerfile: Dockerfile
    container_name: alphaflow_worker_1
    command: npm run start:worker
    environment:
      - RELAYER_PRIVATE_KEY=${WORKER_1_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-alphaflow_dev}@redis:6379
      - RPC_URL=${MANTLE_RPC_PRIMARY:-https://rpc.mantle.xyz}
      - DISPATCHER_ADDRESS=${DISPATCHER_ADDRESS}
      - WORKER_ID=byreal-worker-1
      - STREAM_KEY=agent_insights
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  byreal-worker-2:
    build:
      context: ./agent-tee
      dockerfile: Dockerfile
    container_name: alphaflow_worker_2
    command: npm run start:worker
    environment:
      - RELAYER_PRIVATE_KEY=${WORKER_2_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-alphaflow_dev}@redis:6379
      - RPC_URL=${MANTLE_RPC_PRIMARY:-https://rpc.mantle.xyz}
      - DISPATCHER_ADDRESS=${DISPATCHER_ADDRESS}
      - WORKER_ID=byreal-worker-2
      - STREAM_KEY=agent_insights
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  byreal-worker-3:
    build:
      context: ./agent-tee
      dockerfile: Dockerfile
    container_name: alphaflow_worker_3
    command: npm run start:worker
    environment:
      - RELAYER_PRIVATE_KEY=${WORKER_3_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-alphaflow_dev}@redis:6379
      - RPC_URL=${MANTLE_RPC_PRIMARY:-https://rpc.mantle.xyz}
      - DISPATCHER_ADDRESS=${DISPATCHER_ADDRESS}
      - WORKER_ID=byreal-worker-3
      - STREAM_KEY=agent_insights
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Anvil (Mantle Fork for Dev/Testing) ─────────────────────────────────────
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: alphaflow_anvil
    command: >
      anvil
      --fork-url ${MANTLE_RPC_PRIMARY:-https://rpc.mantle.xyz}
      --chain-id 5000
      --block-time 2
      --host 0.0.0.0
      --port 8545
      --accounts 10
      --balance 10000
    ports:
      - "8545:8545"
    profiles:
      - dev
      - test
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'ok'"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ─── Frontend PWA (Dev Server) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alphaflow_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BFF_HTTP_URL=http://localhost:3001
      - VITE_BFF_WSS_URL=ws://localhost:3001/ws
      - VITE_WC_PROJECT_ID=${VITE_WC_PROJECT_ID:-9add069a8830633afa75d8e490c3f246}
      - VITE_ALPHA_AUDITOR_ADDRESS=${ALPHA_AUDITOR_ADDRESS}
      - VITE_WORKER_1_ADDRESS=${WORKER_1_ADDRESS}
      - VITE_WORKER_2_ADDRESS=${WORKER_2_ADDRESS}
      - VITE_WORKER_3_ADDRESS=${WORKER_3_ADDRESS}
    depends_on:
      bff:
        condition: service_healthy
    profiles:
      - dev

volumes:
  redis_data:
